<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写笔记 · 学习笔记</title>
<meta name="description" content="用 Markdown 写笔记并直接发布到 GitHub">
<script>const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
<link rel="stylesheet" href="./assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./index.html">📚 学习笔记</a>
    <button id="themeToggle" class="theme-btn" aria-label="切换主题" title="切换亮/暗色">🌙</button>
  </div>
</header>

<main class="container reading">
  <a class="back" href="./index.html">← 返回首页</a>
  <h1>✍️ 写笔记</h1>
  <p class="sub" style="color:var(--text-soft);margin-top:0;">支持 Markdown，写好后一键发布到 GitHub（生成独立笔记页并自动更新首页）。<b>正文里可直接 Ctrl+V 粘贴截图、或把图片拖进来，会自动上传并插入。</b></p>

  <details class="settings" open>
    <summary>GitHub 发布设置（仅首次填写，保存在本浏览器）</summary>
    <div class="field">
      <label>仓库（owner/repo）</label>
      <input id="cfgRepo" placeholder="例如 zhangsan/my-notes" autocomplete="off" spellcheck="false">
    </div>
    <div class="grid2">
      <div class="field"><label>分支</label><input id="cfgBranch" value="master" autocomplete="off"></div>
      <div class="field"><label>访问令牌 PAT</label><input id="cfgToken" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off"></div>
    </div>
    <p style="color:var(--text-soft);font-size:.82rem;margin:0;">令牌需要 <code>repo</code> 权限；只存在本机浏览器，仅用于调用 GitHub API 提交笔记，不会发往任何其它服务器。</p>
  </details>

  <div class="form">
    <div class="row2">
      <div class="field"><label>标题</label><input id="fTitle" placeholder="例如 函数与数列"></div>
      <div class="field"><label>科目</label><select id="fSubject"></select></div>
    </div>

    <div class="field">
      <label>内容（Markdown）</label>
      <div class="editor-grid">
        <textarea id="fMd" placeholder="在此用 Markdown 写笔记…&#10;&#10;## 小标题&#10;- 列表项&#10;&#10;**加粗**、*斜体*、&#96;代码&#96;、&gt; 引用、表格等均可。&#10;💡 直接 Ctrl+V 粘贴截图 / 拖拽图片，会自动上传插入。"></textarea>
        <div class="preview-pane" id="preview"><span class="ph">实时预览会显示在这里…</span></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnPublish">🚀 发布到 GitHub</button>
      <button class="btn" id="btnCopy">📋 复制 HTML</button>
      <button class="btn" id="btnLocal">💾 存为本地草稿</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</main>

<script src="./assets/theme.js"></script>
<script src="./assets/submit-app.js"></script>
</body>
</html>
